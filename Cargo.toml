[package]
name = "rust-clip"
version = "0.1.0"
edition = "2021"
authors = ["Federico Paglioni <paglioni.federico@gmail.com>"]
description = "Peer-to-peer mesh network for clipboard sync over BLE and LAN"
license = "MIT"
default-run = "rust-clip"

[[bin]]
name = "rust-clip"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
# --- System ---
tokio = { version = "1.32", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
flume = "0.11"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"

# --- Crypto ---
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
bip39 = "2.0"
hex = "0.4"
machine-uid = "0.5"
uuid = { version = "1.0", features = ["v4"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = "2.0.1"
zeroize = "1.7"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
dashmap = "5.5"

# --- Clipboard ---
arboard = "3.3"

# --- Networking ---
mdns-sd = "0.10"

# --- Config ---
hostname = "0.3"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSDictionary", "NSData", "NSError", "NSTimer"] }
objc2-core-bluetooth = { version = "0.3.2", features = [
    "CBPeripheralManager",
    "CBAdvertisementData",
    "CBUUID",
    "CBService",
    "CBCharacteristic",
    "CBATTRequest",
    "CBCentralManager",
    "CBPeripheral",
    "CBPeer",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
